plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

// Set Java version for the project
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Add Maven repositories for dependencies
repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

// Define dependencies
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Cloth Config for config screen
    api("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api", module: "fabric-api")
    }

    // Mod Menu API for mod menu integration
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}")
}

// Set source directories to match existing project structure
sourceSets {
    main {
        java {
            srcDirs = ['many_utils']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

// Set archive base name
base {
    archivesName = 'Many_Utils26.3'
}
