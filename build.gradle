plugins {
    id 'fabric-loom' version '1.16-SNAPSHOT'
}

// Set Java version for the project
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// Add Maven repositories for dependencies
repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

// Define dependencies
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    
    // Cloth Config for config screen
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api", module: "fabric-api")
    }
    
    // Mod Menu API for mod menu integration
    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version}")
}

// Set source directories to match existing project structure
sourceSets {
    main {
        java {
            srcDirs = ['mc_utils']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

// Set archive base name
base {
    archivesName = 'Minecraft_Utils'
}